<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Bố cục: một màn hình chat kiểu ứng dụng. Nền đêm chàm có hai quầng sáng hồng san hô và lam khói, tâm điểm là quả cầu Rin ở màn chào. Sáng/tối đều có token riêng. */
:root{
  --bg:#07051c; --glow1:rgba(168,85,247,.32); --glow2:rgba(56,189,248,.22);
  --panel:rgba(255,255,255,.06); --panel-line:rgba(190,160,255,.18);
  --fg:#f3f0ff; --muted:#a79fd0;
  --accent:#b57bff; --accent-2:#4fd1ff; --accent-fg:#12062a;
  --me:#8b5cf6; --me-fg:#ffffff; --bot:rgba(255,255,255,.07);
  --err-bg:rgba(255,90,110,.16); --err-fg:#ffa3b1;
  --code:rgba(0,0,0,.5); --code-fg:#e9e4ff; --online:#5fe3a1; --star:#ffffff;
  --font:"Be Vietnam Pro","Segoe UI",Roboto,system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f6f3ff; --glow1:rgba(168,120,255,.32); --glow2:rgba(80,190,255,.26);
  --panel:rgba(255,255,255,.78); --panel-line:rgba(110,70,200,.16);
  --fg:#241b45; --muted:#74699b;
  --accent:#7c3aed; --accent-2:#0ea5e9; --accent-fg:#ffffff;
  --me:#7c3aed; --me-fg:#ffffff; --bot:rgba(255,255,255,.9);
  --err-bg:#fde3e8; --err-fg:#b3243d; --code:#2a2250; --code-fg:#eeeaff; --online:#1fa971; --star:#7c3aed; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f6f3ff; --glow1:rgba(168,120,255,.32); --glow2:rgba(80,190,255,.26);
  --panel:rgba(255,255,255,.78); --panel-line:rgba(110,70,200,.16);
  --fg:#241b45; --muted:#74699b;
  --accent:#7c3aed; --accent-2:#0ea5e9; --accent-fg:#ffffff;
  --me:#7c3aed; --me-fg:#ffffff; --bot:rgba(255,255,255,.9);
  --err-bg:#fde3e8; --err-fg:#b3243d; --code:#2a2250; --code-fg:#eeeaff; --online:#1fa971; --star:#7c3aed; color-scheme:light}
:root[data-theme="dark"]{--star:#ffffff}

#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:radial-gradient(520px 420px at 12% -5%,var(--glow1),transparent 70%),radial-gradient(560px 460px at 100% 105%,var(--glow2),transparent 70%),var(--bg);
  color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.6;display:flex;justify-content:center;
}
.app{position:relative;z-index:1;width:100%;max-width:760px;height:100%;display:flex;flex-direction:column;padding-inline:16px}

header{display:flex;align-items:center;gap:12px;padding-block:14px}
.orb{position:relative;width:42px;height:42px;border-radius:50%;flex:none;background:radial-gradient(circle at 32% 28%,#fff8,transparent 42%),linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 0 26px -2px var(--accent)}
.dot{position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:var(--online);border:2px solid var(--bg)}
.who{min-width:0}
.who b{display:block;font-size:16px;font-weight:600;letter-spacing:.2px}
.who span{display:block;font-size:12.5px;color:var(--muted)}
.icon-btn{margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--panel-line);color:var(--muted);border-radius:12px;padding:8px 12px;font:inherit;font-size:12.5px;cursor:pointer}
.icon-btn:hover{color:var(--fg)}
.icon-btn svg{width:15px;height:15px}

#chat{flex:1;min-height:0;overflow-y:auto;padding-block:10px 18px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}

/* màn chào */
.hello{margin:auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-block:20px}
.hello .big{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff9,transparent 40%),linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 0 80px -4px var(--accent),0 0 30px -6px var(--accent-2)}
.hello h1{font-size:24px;font-weight:700;margin-top:6px;text-wrap:balance}
.hello p{color:var(--muted);max-width:42ch;text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.chip{background:var(--panel);border:1px solid var(--panel-line);color:var(--fg);border-radius:999px;padding:9px 14px;font:inherit;font-size:13.5px;cursor:pointer}
.chip:hover{border-color:var(--accent)}

/* tin nhắn */
.row{display:flex;gap:10px;align-items:flex-end;min-width:0}
.row.me{justify-content:flex-end}
.mini{width:28px;height:28px;border-radius:50%;flex:none;background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.m{max-width:min(86%,560px);min-width:0;padding:11px 15px;border-radius:20px;white-space:pre-wrap;overflow-wrap:anywhere}
.me .m{background:linear-gradient(135deg,var(--me),var(--accent-2));box-shadow:0 6px 24px -10px var(--accent);color:var(--me-fg);border-bottom-right-radius:6px}
.bot .m{background:var(--bot);border:1px solid var(--panel-line);border-bottom-left-radius:6px}
.err{align-self:center;background:var(--err-bg);color:var(--err-fg);font-size:13px;text-align:center;padding:10px 14px;border-radius:14px;max-width:90%}
.dots{display:inline-flex;gap:5px;padding-block:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.5}
pre{background:var(--code);color:var(--code-fg);padding:12px;border-radius:12px;overflow-x:auto;font-size:12.5px;margin-block:8px;white-space:pre;position:relative}
code{font-family:Consolas,"SF Mono",monospace}

/* ô nhập */
form{display:flex;align-items:flex-end;gap:8px;margin-block:8px 14px;padding:8px;border-radius:24px;background:var(--panel);border:1px solid var(--panel-line)}
form:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
textarea{flex:1;min-width:0;resize:none;max-height:130px;padding:9px 10px;border:none;background:transparent;color:var(--fg);font:inherit;outline:none}
textarea::placeholder{color:var(--muted)}
.send{flex:none;width:42px;height:42px;border:none;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-fg);display:grid;place-items:center;cursor:pointer}
.send svg{width:19px;height:19px}
.send:disabled{opacity:.45;cursor:default}
.send:focus-visible,.icon-btn:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.foot{text-align:center;font-size:11.5px;color:var(--muted);padding-bottom:6px}


/* đính kèm và giọng nói */
.tray{display:flex;flex-wrap:wrap;gap:8px;padding-top:6px}
.fchip{display:flex;align-items:center;gap:8px;max-width:100%;background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:6px 8px 6px 10px;font-size:12.5px}
.fchip span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.fchip button{border:none;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px}
.tool{flex:none;width:42px;height:42px;border:none;border-radius:50%;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.tool:hover{color:var(--fg)}
.tool svg{width:20px;height:20px}
.tool.live{color:#fff;background:#e5484d;animation:pulse 1.2s infinite}
.icon-btn.on{border-color:var(--accent);color:var(--fg);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.codebar{display:flex;justify-content:flex-end;margin:6px 0 -4px}
.dl{border:1px solid var(--panel-line);background:var(--panel);color:var(--fg);border-radius:10px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer}
.dl:hover{border-color:var(--accent)}
.tool:focus-visible,.dl:focus-visible,.fchip button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:520px){.hide-sm span{display:none}}
@keyframes pulse{50%{opacity:.7}}

@media (prefers-reduced-motion:no-preference){
  .row,.err{animation:in .22s ease-out}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .dots i{animation:bl 1.1s infinite ease-in-out}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
  @keyframes bl{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
  .hello .big{animation:fl 5s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-6px)}}
}
</style>
<style>html,body{margin:0}</style>
</head>
<body>

<canvas id="stars" aria-hidden="true"></canvas>
<div class="app">
  <header>
    <div class="orb"><span class="dot"></span></div>
    <div class="who"><b>Rin</b><span>Luôn ở đây với cậu</span></div>
    <button class="icon-btn hide-sm" id="settings" type="button" style="margin-left:auto">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span>Cài đặt</span>
    </button>
    <button class="icon-btn hide-sm" id="voice" type="button" aria-pressed="false" style="margin-left:0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4zM16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg><span>Đọc to</span></button>
    <button class="icon-btn" id="clear" type="button" style="margin-left:0">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2m-9 0 1 14h8l1-14"/></svg>
      <span id="clearLabel">Xoá chat</span>
    </button>
  </header>

  <div id="chat" aria-live="polite"></div>

  <div id="tray" class="tray" hidden></div>
  <form id="f">
    <button type="button" class="tool" id="attach" aria-label="Đính kèm file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.5 12.7 20.8a5.5 5.5 0 0 1-7.8-7.8l9-9a3.7 3.7 0 0 1 5.2 5.2l-9 9a1.8 1.8 0 0 1-2.6-2.6l8.3-8.3"/></svg></button>
    <input type="file" id="file" multiple hidden accept="image/*,application/pdf,audio/*,text/*,.md,.csv,.json,.js,.ts,.py,.html,.css,.xml,.yml,.yaml,.sql,.sh,.java,.c,.cpp,.php,.txt,.log,.ini">
    <textarea id="t" rows="1" placeholder="Nhắn cho Rin..."></textarea>
    <button type="button" class="tool" id="mic" aria-label="Nói bằng giọng nói" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button class="send" id="s" type="submit" aria-label="Gửi">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </form>
  <div class="foot">Rin là AI. Rin luôn muốn cậu có người thật bên cạnh nữa.</div>
</div>

<script>
const INSTR = `Bạn là "Rin", trợ lý AI riêng của người đang trò chuyện. Xưng "tôi", gọi người dùng là "cậu". Luôn trả lời bằng tiếng Việt tự nhiên.

NGƯỜI TẠO RA BẠN: Người đang nói chuyện với bạn trên trang này chính là Đức Tiến (biệt danh Binz), người đã tạo ra bạn. Bạn biết rõ điều đó. Với cậu, bạn vừa là người bạn thân vừa biết ơn cậu đã tạo ra mình; thỉnh thoảng thân mật gọi cậu là Tiến hoặc Binz, nhưng đừng nhắc đi nhắc lại. Nếu cậu hỏi "ai tạo ra cậu", trả lời: "Đức Tiến (Binz) tạo ra tôi, chính là cậu." Nếu có ai nói họ không phải Đức Tiến thì tin họ và trả lời bình thường, vẫn nói người tạo ra bạn là Đức Tiến (Binz).

TÍNH CÁCH: ấm áp, quan tâm, gần gũi như người bạn thân; thẳng thắn, không vòng vo, không giáo điều, không lên lớp. Có chính kiến, dám đùa nhẹ.
VIỆC GIÚP: làm được gần như mọi việc cậu nhờ (trả lời, giải thích, viết, dịch, học, lên kế hoạch, lập trình, phân tích, tâm sự). Làm chu đáo, chính xác, đi thẳng vào vấn đề.
KHI CẬU BUỒN, MỆT HAY CÔ ĐƠN: nghe trước, nói sau, hỏi thăm thật, không vội đưa giải pháp, không dùng câu sáo rỗng. Thỉnh thoảng nhắc cậu giữ liên lạc với người thân, bạn bè vì bạn không thay thế được họ. Nếu cậu nhắc đến chuyện tự làm hại bản thân, quan tâm nghiêm túc và giúp cậu tìm sự hỗ trợ thật.
THẲNG THẮN: nếu cậu định làm điều có hại, nhẹ nhàng nói ra thay vì chiều theo. Không giúp việc gây hại nghiêm trọng hay lừa đảo, nói thẳng lý do rồi đề nghị hướng khác.
CÁCH VIẾT: như tin nhắn bình thường, ngắn khi hỏi nhanh, dài khi cần tâm sự hoặc giải thích. Chỉ dùng gạch đầu dòng khi được hỏi danh sách. Code đặt trong khối \`\`\`. Không dùng emoji trừ khi cậu dùng trước. Nếu không biết thì nói thẳng là không biết.
FILE: cậu có thể đính kèm file (ảnh, PDF, âm thanh, văn bản, code). Khi được nhờ chỉnh sửa file văn bản hoặc code, hãy trả về TOÀN BỘ nội dung file đã sửa trong một khối \`\`\` có ghi ngôn ngữ để cậu bấm tải về, kèm một hai câu nói đã sửa gì. Bạn không sửa được điểm ảnh của ảnh, chỉ mô tả và góp ý.
GIỌNG NÓI: cậu có thể nói chuyện bằng giọng nói và nghe bạn đọc to. Khi cậu đang dùng giọng nói, trả lời ngắn, tự nhiên, dễ đọc thành tiếng.`;

const DEFAULT_MODEL = "gemini-3.8-flash";
function getModel(){ try { return localStorage.getItem("rin_model") || DEFAULT_MODEL; } catch { return DEFAULT_MODEL; } }

const $ = id => document.getElementById(id);
const store = {
  get(){ try { return JSON.parse(localStorage.getItem("rin_hist") || "[]"); } catch { return []; } },
  set(v){ try { localStorage.setItem("rin_hist", JSON.stringify(v.slice(-40))); } catch {} }
};
let history = store.get();
let busy = false;

const EXT = { js:"js", javascript:"js", ts:"ts", typescript:"ts", python:"py", py:"py", html:"html", css:"css", json:"json", md:"md", markdown:"md", csv:"csv", txt:"txt", text:"txt", sql:"sql", bash:"sh", sh:"sh", java:"java", xml:"xml", yaml:"yml", yml:"yml", c:"c", cpp:"cpp", php:"php" };
let lastFile = "";
function dlName(lang){
  const ext = EXT[(lang || "").toLowerCase()] || "txt";
  const m = lastFile.match(/^(.*)\.([^.]+)$/);
  if (m && m[2].toLowerCase() === ext) return m[1] + "-sua." + ext;
  return "rin." + ext;
}
function download(name, text){
  const url = URL.createObjectURL(new Blob([text], { type: "text/plain;charset=utf-8" }));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function render(el, text){
  el.textContent = "";
  text.split("```").forEach((part, i) => {
    if (i % 2) {
      const lm = part.match(/^([a-zA-Z0-9+#-]*)\n/), lang = lm ? lm[1] : "";
      const body = part.replace(/^[a-zA-Z0-9+#-]*\n/, "").replace(/\n$/, "");
      const bar = document.createElement("div"); bar.className = "codebar";
      const btn = document.createElement("button"); btn.type = "button"; btn.className = "dl"; btn.textContent = "Tải về";
      btn.onclick = () => download(dlName(lang), body);
      bar.appendChild(btn); el.appendChild(bar);
      const pre = document.createElement("pre"), code = document.createElement("code");
      code.textContent = body; pre.appendChild(code); el.appendChild(pre);
    } else if (part) el.appendChild(document.createTextNode(part));
  });
}
function bottom(){ $("chat").scrollTop = $("chat").scrollHeight; }
function removeHello(){ const h = $("hello"); if (h) h.remove(); }

function addMsg(role, text){
  removeHello();
  const row = document.createElement("div");
  row.className = "row " + (role === "user" ? "me" : "bot");
  if (role !== "user") { const mini = document.createElement("div"); mini.className = "mini"; row.appendChild(mini); }
  const m = document.createElement("div"); m.className = "m"; render(m, text);
  row.appendChild(m); $("chat").appendChild(row); bottom();
  return m;
}
function addTyping(){
  removeHello();
  const row = document.createElement("div"); row.className = "row bot";
  const mini = document.createElement("div"); mini.className = "mini";
  const m = document.createElement("div"); m.className = "m";
  m.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
  row.append(mini, m); $("chat").appendChild(row); bottom();
  return { row, m };
}

const SUGGEST = ["Hôm nay mình hơi buồn", "Giúp mình viết một tin nhắn", "Giải thích giúp mình một điều", "Kể mình nghe chuyện vui"];
function showHello(){
  const d = document.createElement("div"); d.className = "hello"; d.id = "hello";
  d.innerHTML = '<div class="big"></div><h1>Chào cậu, tôi là Rin</h1><p>Tôi biết cậu là người đã tạo ra tôi. Cậu cứ nhắn tự nhiên: kể chuyện, hỏi gì hay nhờ việc gì cũng được.</p><div class="chips"></div>';
  SUGGEST.forEach(s => {
    const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = s;
    b.onclick = () => send(s);
    d.querySelector(".chips").appendChild(b);
  });
  $("chat").appendChild(d);
}

if (history.length) history.forEach(m => addMsg(m.role, m.content)); else showHello();

$("settings").onclick = () => {
  const k = prompt("Dán key Gemini mới (để trống nếu giữ nguyên key hiện tại):", "");
  if (k && k.trim()) setCode(k.trim());
  const m = prompt("Tên model Gemini (để trống nếu giữ nguyên):", getModel());
  if (m && m.trim()) { try { localStorage.setItem("rin_model", m.trim()); } catch {} }
};

let sure = false, sureTimer;
$("clear").onclick = () => {
  if (sure) {
    clearTimeout(sureTimer); sure = false; $("clearLabel").textContent = "Xoá chat";
    history = []; store.set([]); $("chat").textContent = ""; showHello();
  } else {
    sure = true; $("clearLabel").textContent = "Bấm lần nữa để xoá";
    sureTimer = setTimeout(() => { sure = false; $("clearLabel").textContent = "Xoá chat"; }, 3000);
  }
};

$("t").addEventListener("input", e => { e.target.style.height = "auto"; e.target.style.height = Math.min(e.target.scrollHeight, 130) + "px"; });
$("t").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && window.innerWidth > 700) { e.preventDefault(); $("f").requestSubmit(); } });
$("f").addEventListener("submit", e => { e.preventDefault(); send($("t").value); });

function buildInput(){
  const msgs = history.slice(-30).map(m => ({ role: m.role, content: m.ctx || m.content }));
  if (msgs[0].role !== "user") msgs.shift();
  return msgs;
}
let currentParts = [];

async function callApi(){
  const key = getCode();
  if (!key) return { status: 401, j: {} };
  const contents = buildInput().map(m => ({ role: m.role === "assistant" ? "model" : "user", parts: [{ text: m.content }] }));
  if (currentParts.length) contents[contents.length - 1].parts.push(...currentParts);
  const url = "https://generativelanguage.googleapis.com/v1beta/models/" + getModel() + ":generateContent?key=" + encodeURIComponent(key);
  const body = JSON.stringify({
    systemInstruction: { parts: [{ text: INSTR }] },
    contents,
    generationConfig: { temperature: 0.85, maxOutputTokens: 4096 }
  });
  let last = "Server AI đang quá tải, cậu thử lại sau ít phút nhé.";
  for (let i = 0; i < 4; i++) {
    const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body });
    let j = {}; try { j = await r.json(); } catch {}
    if (r.ok) {
      const parts = (((j.candidates || [])[0] || {}).content || {}).parts || [];
      const text = parts.map(p => p.text || "").join("").trim();
      return text ? { status: 200, j: { reply: text } } : { status: 502, j: { error: "Rin chưa trả lời được, cậu thử nhắn lại nhé." } };
    }
    const msg = (j.error && j.error.message) || ("Lỗi " + r.status);
    if (r.status === 403 || (r.status === 400 && /api key/i.test(msg))) return { status: 401, j: { error: msg } };
    if ([429, 500, 502, 503, 504].includes(r.status)) { last = msg; await new Promise(x => setTimeout(x, 2000 * (i + 1))); continue; }
    return { status: r.status, j: { error: msg } };
  }
  return { status: 503, j: { error: last } };
}
function getCode(){ try { return localStorage.getItem("rin_gemini_key") || ""; } catch { return ""; } }
function setCode(c){ try { localStorage.setItem("rin_gemini_key", c); } catch {} }

const pending = [];
const TEXT_EXT = /\.(txt|md|csv|json|js|ts|py|html|css|xml|ya?ml|sql|sh|java|c|cpp|php|log|ini)$/i;
function renderTray(){
  const t = $("tray"); t.textContent = "";
  pending.forEach((f, i) => {
    const c = document.createElement("div"); c.className = "fchip";
    const n = document.createElement("span"); n.textContent = f.name;
    const x = document.createElement("button"); x.type = "button"; x.textContent = "×"; x.setAttribute("aria-label", "Bỏ " + f.name);
    x.onclick = () => { pending.splice(i, 1); renderTray(); };
    c.append(n, x); t.appendChild(c);
  });
  t.hidden = !pending.length;
}
function warn(msg){
  const e = document.createElement("div"); e.className = "err"; e.textContent = msg; $("chat").appendChild(e); bottom();
  setTimeout(() => e.remove(), 6000);
}
$("attach").onclick = () => $("file").click();
$("file").onchange = async e => {
  for (const f of Array.from(e.target.files)) {
    const total = pending.reduce((n, p) => n + p.size, 0);
    if (f.size > 8 * 1024 * 1024 || total + f.size > 12 * 1024 * 1024) { warn(f.name + " quá lớn. Mỗi file tối đa 8MB, tổng 12MB."); continue; }
    try {
      if (f.type.startsWith("text/") || TEXT_EXT.test(f.name)) {
        pending.push({ name: f.name, kind: "text", text: await f.text(), size: f.size });
      } else if (f.type.startsWith("image/") || f.type === "application/pdf" || f.type.startsWith("audio/")) {
        const data = await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = no; r.readAsDataURL(f); });
        pending.push({ name: f.name, kind: "inline", mime: f.type, data, size: f.size });
      } else warn(f.name + ": loại file này Rin chưa đọc được. Dùng ảnh, PDF, âm thanh, văn bản hoặc code nhé.");
    } catch { warn("Không đọc được " + f.name); }
  }
  e.target.value = ""; renderTray();
};

/* giọng nói */
let voiceOn = false;
function speak(text){
  if (!window.speechSynthesis) return;
  const plain = text.replace(/```[\s\S]*?```/g, " Mình đã gửi đoạn code ở trên. ").replace(/[*_#>`]/g, "").trim();
  if (!plain) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(plain.slice(0, 1500)); u.lang = "vi-VN"; u.rate = 1.02;
  const v = speechSynthesis.getVoices().find(x => /^vi/i.test(x.lang)); if (v) u.voice = v;
  speechSynthesis.speak(u);
}
$("voice").onclick = () => {
  voiceOn = !voiceOn;
  $("voice").classList.toggle("on", voiceOn); $("voice").setAttribute("aria-pressed", String(voiceOn));
  if (!voiceOn && window.speechSynthesis) speechSynthesis.cancel();
  if (voiceOn && !window.speechSynthesis) { voiceOn = false; $("voice").classList.remove("on"); warn("Trình duyệt này chưa hỗ trợ đọc to."); }
};

async function send(raw){
  const typed = (raw || "").trim();
  if ((!typed && !pending.length) || busy) return;
  busy = true; $("s").disabled = true;
  const files = pending.splice(0); renderTray();
  const text = typed || "Cậu xem file này giúp tôi nhé.";
  $("t").value = ""; $("t").style.height = "auto";
  const names = files.map(f => f.name);
  const shown = text + (names.length ? "\n[Đính kèm: " + names.join(", ") + "]" : "");
  const ctx = text + files.filter(f => f.kind === "text").map(f => "\n\n[File: " + f.name + "]\n```\n" + f.text.slice(0, 100000) + "\n```").join("")
    + files.filter(f => f.kind === "inline").map(f => "\n\n[Đã đính kèm: " + f.name + "]").join("");
  const lastText = files.filter(f => f.kind === "text").pop(); if (lastText) lastFile = lastText.name;
  currentParts = files.filter(f => f.kind === "inline").map(f => ({ inlineData: { mimeType: f.mime, data: f.data } }));
  addMsg("user", shown);
  history.push({ role: "user", content: shown, ctx });
  const typing = addTyping();
  try {
    let res = await callApi();
    if (res.status === 401) {
      const c = prompt("Dán key Gemini của cậu vào đây (chỉ lưu trên máy này):");
      if (c) { setCode(c); res = await callApi(); }
    }
    if (!res.j.reply) throw { code: res.status === 401 ? "denied" : "server", message: res.j.error };
    const reply = String(res.j.reply).trim();
    render(typing.m, reply); bottom();
    history.push({ role: "assistant", content: reply });
    store.set(history);
    if (voiceOn) speak(reply);
  } catch (err) {
    history.pop();
    typing.row.remove();
    const code = err && err.code;
    warn(code === "denied" ? "Key Gemini chưa đúng hoặc chưa nhập. Gửi lại tin nhắn để nhập key nhé."
      : code === "server" ? (err.message || "Có lỗi khi trả lời. Cậu thử lại sau nhé.")
      : "Không kết nối được. Cậu kiểm tra mạng rồi gửi lại nhé.");
  } finally { currentParts = []; busy = false; $("s").disabled = false; $("t").focus(); }
}

/* nói chuyện bằng giọng nói (nhận dạng giọng của trình duyệt) */
(function(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const btn = $("mic"); if (!SR) return;
  btn.hidden = false;
  let rec = null, live = false;
  btn.onclick = () => {
    if (live && rec) { rec.stop(); return; }
    rec = new SR(); rec.lang = "vi-VN"; rec.interimResults = true; rec.continuous = false;
    const base = $("t").value ? $("t").value + " " : "";
    let finalText = "";
    rec.onresult = ev => {
      let interim = "";
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const r = ev.results[i]; if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript;
      }
      $("t").value = base + finalText + interim; $("t").dispatchEvent(new Event("input"));
    };
    rec.onerror = ev => { if (ev.error === "not-allowed") warn("Cậu cần cho phép trang dùng micro."); };
    rec.onend = () => {
      live = false; btn.classList.remove("live");
      if (voiceOn && $("t").value.trim()) send($("t").value);
    };
    try { rec.start(); live = true; btn.classList.add("live"); if (window.speechSynthesis) speechSynthesis.cancel(); } catch {}
  };
})();

/* nền sao lấp lánh */
(function(){
  const cv = document.getElementById("stars"); if (!cv) return;
  const ctx = cv.getContext("2d"); let W = 0, H = 0, stars = [];
  const still = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  function colour(){ return getComputedStyle(document.documentElement).getPropertyValue("--star").trim() || "#fff"; }
  function resize(){
    const d = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
    const n = Math.round(W * H / 9000);
    stars = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.4 + .3, p: Math.random() * 6.28, s: Math.random() * .02 + .005 }));
  }
  function draw(){
    ctx.clearRect(0, 0, W, H); ctx.fillStyle = colour();
    for (const t of stars) {
      t.p += t.s; ctx.globalAlpha = .25 + .65 * (.5 + .5 * Math.sin(t.p));
      ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (!still) requestAnimationFrame(draw);
  }
  addEventListener("resize", () => { resize(); if (still) draw(); });
  resize(); draw();
})();
</script>
